<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #011627;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    color: #e0f2fe;
    user-select: none;
  }
  #container {
    position: relative;
    width: 100%;
    height: 620px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid rgba(56, 189, 248, 0.45);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  .ocean-hud {
    position: absolute;
    top: 14px; left: 14px;
    background: rgba(3, 15, 30, 0.90);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 10px;
    padding: 12px 18px;
    color: #e0f2fe;
    font-size: 13px;
    line-height: 1.55;
    z-index: 10;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    pointer-events: none;
    min-width: 250px;
  }
  .hud-title {
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #38bdf8;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hud-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .hud-label { color: #94a3b8; font-weight: 500; }
  .hud-val { font-weight: 700; color: #f8fafc; }
  .hud-highlight { color: #38bdf8; font-size: 15px; }

  .controls-bar {
    position: absolute;
    bottom: 14px; left: 50%;
    transform: translateX(-50%);
    background: rgba(2, 12, 24, 0.92);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 30px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
    box-shadow: 0 8px 30px rgba(0,0,0,0.7);
  }
  .btn {
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #e0f2fe;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    outline: none;
  }
  .btn:hover {
    background: rgba(56, 189, 248, 0.35);
    color: #ffffff;
    border-color: #38bdf8;
    transform: translateY(-1px);
  }
  .btn-active {
    background: #0284c7 !important;
    border-color: #38bdf8 !important;
    color: #ffffff !important;
  }
  .slider-box {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #7dd3fc;
    font-size: 12px;
    font-weight: 700;
    font-family: monospace;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 220px;
    height: 6px;
    background: rgba(56, 189, 248, 0.25);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #38bdf8;
    cursor: pointer;
    box-shadow: 0 0 8px #38bdf8;
    transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }
  .legend-badge {
    position: absolute;
    bottom: 14px; right: 14px;
    background: rgba(3, 15, 30, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.6;
    color: #cbd5e1;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="container">
  <canvas id="oceanCanvas"></canvas>

  <div class="ocean-hud">
    <div class="hud-title">📡 SATELLITE OCEAN WATER CAMERA</div>
    <div class="hud-row">
      <span class="hud-label">True Heading (COG):</span>
      <span class="hud-val hud-highlight" id="hudCourse">000°</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">Vessel Speed:</span>
      <span class="hud-val" id="hudSpeed">0.0 kts</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">Nearest Clearance:</span>
      <span class="hud-val" id="hudClearance">--- m</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">TwinGuard Gate:</span>
      <span class="hud-val" id="hudGate" style="font-weight:800;">APPROVE</span>
    </div>
  </div>

  <div class="controls-bar">
    <button class="btn" id="playBtn">⏸ Pause</button>
    <button class="btn" id="rewindBtn">⏮ Restart</button>
    <div class="slider-box">
      <span id="timeText">T+0s</span>
      <input type="range" id="timeSlider" min="0" max="__MAX_FRAMES__" value="0">
    </div>
    <button class="btn" id="loopBtn" title="Toggle Auto-Looping">🔁 Loop: ON</button>
    <button class="btn" id="spd1">1x</button>
    <button class="btn" id="spd2">2x</button>
  </div>

  <div class="legend-badge">
    <div>🚢 <span style="color:#38bdf8; font-weight:700;">Blue Ship:</span> TwinGuard Autonomous Vessel</div>
    <div>🔴 <span style="color:#ef4444; font-weight:700;">Red Ship:</span> Encounter Target Vessel</div>
    <div>⭐ <span style="color:#22c55e; font-weight:700;">Green Buoy:</span> Fairway Waypoint Destination</div>
    <div>🏝️ <span style="color:#eab308; font-weight:700;">Yellow/Green:</span> Shallow Reef & Island</div>
  </div>
</div>

<script>
  const history = __HISTORY_JSON__;
  const audits = __AUDITS_JSON__;
  const goalPos = __GOAL_JSON__;
  const staticObs = __OBS_JSON__;

  const canvas = document.getElementById("oceanCanvas");
  const ctx = canvas.getContext("2d");

  let width, height;
  function resize() {
    width = canvas.width = canvas.parentElement.clientWidth;
    height = canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  let currentFrame = 0;
  let isPlaying = true;
  let isLooping = true;
  let speedMultiplier = 1;
  let waveOffset = 0;
  let lastFrameStepTime = performance.now();
  const stepIntervalMs = 80; // ~12.5 steps per second at 1x for realistic smooth viewing

  function toScreen(x, y) {
    const scale = Math.min(width / 3200, height / 2400) * 1.35;
    const cx = width / 2;
    const cy = height * 0.65;
    return {
      x: cx + x * scale,
      y: cy - (y - 300) * scale,
      scale: scale
    };
  }

  function drawOceanWater() {
    // Rich deep blue oceanic gradient
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, "#012a4a");
    grad.addColorStop(0.3, "#014f86");
    grad.addColorStop(0.7, "#2a6f97");
    grad.addColorStop(1, "#013a63");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Dynamic wave ripples (realistic undulating wave crests)
    ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
    ctx.lineWidth = 1.6;
    for (let row = 20; row < height; row += 36) {
      ctx.beginPath();
      for (let col = 0; col < width; col += 20) {
        const waveY = row + Math.sin(col * 0.02 + waveOffset + row * 0.08) * 4.5;
        if (col === 0) ctx.moveTo(col, waveY);
        else ctx.lineTo(col, waveY);
      }
      ctx.stroke();
    }

    // Secondary deep swells
    ctx.strokeStyle = "rgba(56, 189, 248, 0.09)";
    ctx.lineWidth = 3.0;
    for (let row = 40; row < height; row += 50) {
      ctx.beginPath();
      for (let col = 0; col < width; col += 25) {
        const waveY = row + Math.cos(col * 0.015 - waveOffset * 0.8 + row * 0.05) * 6;
        if (col === 0) ctx.moveTo(col, waveY);
        else ctx.lineTo(col, waveY);
      }
      ctx.stroke();
    }

    // Sunlight shimmers on ocean surface
    ctx.fillStyle = "rgba(224, 242, 254, 0.05)";
    for (let i = 0; i < 9; i++) {
      const sx = ((i * 190 + waveOffset * 22) % (width + 200)) - 100;
      const sy = (i * 70) % height;
      ctx.beginPath();
      ctx.ellipse(sx, sy, 75, 22, Math.PI / 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawIslands() {
    if (!staticObs || staticObs.length === 0) return;
    staticObs.forEach(([ox, oy, orad]) => {
      const sc = toScreen(ox, oy);
      const rPix = orad * sc.scale;

      // Shallow reef lagoon (aquamarine)
      ctx.fillStyle = "rgba(13, 148, 136, 0.50)";
      ctx.beginPath();
      ctx.arc(sc.x, sc.y, rPix * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Outer safety boundary ring (dashed white)
      ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Sand bank (yellowish sand)
      ctx.fillStyle = "#eab308";
      ctx.beginPath();
      ctx.arc(sc.x, sc.y, rPix * 1.05, 0, Math.PI * 2);
      ctx.fill();

      // Rocky island core (green vegetation)
      ctx.fillStyle = "#15803d";
      ctx.beginPath();
      ctx.arc(sc.x, sc.y, rPix * 0.82, 0, Math.PI * 2);
      ctx.fill();

      // Lighthouse base
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(sc.x - 4, sc.y - 12, 8, 16);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(sc.x - 4, sc.y - 6, 8, 4);

      // Flashing maritime beacon beam
      const pulse = (Math.sin(waveOffset * 3) + 1) * 0.5;
      ctx.fillStyle = "rgba(253, 224, 71, " + (0.25 + pulse * 0.5) + ")";
      ctx.beginPath();
      ctx.arc(sc.x, sc.y - 12, 22 + pulse * 14, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawWaypoint() {
    if (!goalPos || goalPos.length < 2) return;
    const sc = toScreen(goalPos[0], goalPos[1]);
    const ringR = (waveOffset * 14) % 36;
    ctx.strokeStyle = "rgba(74, 222, 128, " + (1.0 - ringR / 36) + ")";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(sc.x, sc.y, ringR, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "#22c55e";
    ctx.beginPath();
    ctx.arc(sc.x, sc.y, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#ecfdf5";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText("⭐ DESTINATION FAIRWAY", sc.x - 70, sc.y - 16);
  }

  function drawShip(x, y, course, speed, isOurShip, shipName, colorHex) {
    const sc = toScreen(x, y);
    const L = (isOurShip ? 120 : 110) * sc.scale;
    const B = (isOurShip ? 34 : 32) * sc.scale;

    ctx.save();
    ctx.translate(sc.x, sc.y);
    ctx.rotate(course);

    // Realistic Foaming Stern Wake
    const wakeL = Math.max(45, speed * 13) * sc.scale;
    const wakeW = wakeL * 0.42;
    const sternY = L * 0.45;

    const wakeGrad = ctx.createLinearGradient(0, sternY, 0, sternY + wakeL);
    wakeGrad.addColorStop(0, "rgba(255, 255, 255, 0.85)");
    wakeGrad.addColorStop(0.35, "rgba(200, 240, 255, 0.45)");
    wakeGrad.addColorStop(1, "rgba(255, 255, 255, 0)");

    ctx.fillStyle = wakeGrad;
    ctx.beginPath();
    ctx.moveTo(0, sternY);
    ctx.lineTo(-wakeW, sternY + wakeL);
    ctx.lineTo(wakeW, sternY + wakeL);
    ctx.closePath();
    ctx.fill();

    // Secondary outer wake curls
    ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, sternY);
    ctx.lineTo(-wakeW * 1.25, sternY + wakeL * 1.15);
    ctx.moveTo(0, sternY);
    ctx.lineTo(wakeW * 1.25, sternY + wakeL * 1.15);
    ctx.stroke();

    // Water shadow under vessel hull
    ctx.fillStyle = "rgba(0, 15, 35, 0.50)";
    ctx.beginPath();
    ctx.ellipse(6, 6, B * 0.55, L * 0.52, 0, 0, Math.PI * 2);
    ctx.fill();

    // Hull (pointed bow, parallel midbody, transom stern)
    ctx.fillStyle = colorHex;
    ctx.beginPath();
    ctx.moveTo(0, -L * 0.52);
    ctx.lineTo(B * 0.48, -L * 0.22);
    ctx.lineTo(B * 0.48, L * 0.38);
    ctx.lineTo(B * 0.25, L * 0.48);
    ctx.lineTo(-B * 0.25, L * 0.48);
    ctx.lineTo(-B * 0.48, L * 0.38);
    ctx.lineTo(-B * 0.48, -L * 0.22);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.0;
    ctx.stroke();

    // Deck cargo containers (colorful container bays)
    const colors = ["#ef4444", "#3b82f6", "#eab308", "#10b981", "#8b5cf6"];
    const cW = B * 0.36;
    const cH = L * 0.11;
    for (let row = -L * 0.18; row < L * 0.22; row += cH + 2) {
      ctx.fillStyle = colors[Math.abs(Math.floor(row * 7)) % colors.length];
      ctx.fillRect(-cW * 0.92, row, cW * 0.85, cH);
      ctx.fillStyle = colors[Math.abs(Math.floor(row * 13)) % colors.length];
      ctx.fillRect(cW * 0.08, row, cW * 0.85, cH);
    }

    // Bridge Deckhouse superstructure (aft white tower)
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-B * 0.35, L * 0.25, B * 0.7, L * 0.15);
    ctx.fillStyle = "#0284c7";
    ctx.fillRect(-B * 0.28, L * 0.27, B * 0.56, 3); // Bridge navigation windows

    // Navigation lights: Green on Starboard (Right), Red on Port (Left)
    ctx.fillStyle = "#22c55e"; // Starboard Green
    ctx.beginPath();
    ctx.arc(B * 0.48, -L * 0.2, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ef4444"; // Port Red
    ctx.beginPath();
    ctx.arc(-B * 0.48, -L * 0.2, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // If our ship, also draw Fujii safety boundary (glowing oval)
    if (isOurShip) {
      ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.ellipse(0, 0, B * 2.2, L * 1.5, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();

    // Floating vessel name tag
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText(shipName, sc.x + B * 0.8, sc.y);
  }

  function render() {
    waveOffset += 0.035; // continuous water wave ripple
    drawOceanWater();
    drawIslands();
    drawWaypoint();

    const state = history[currentFrame] || history[0];
    const aud = audits[currentFrame] || {};

    // Draw encounter targets
    if (state.targets && state.targets.length > 0) {
      const tColors = ["#ef4444", "#f97316", "#a855f7"];
      state.targets.forEach((tgt, i) => {
        drawShip(tgt.x, tgt.y, tgt.course, tgt.speed, false, "TARGET VESSEL " + (i+1), tColors[i % tColors.length]);

        // Draw dynamic collision risk line to closest target
        const scOwn = toScreen(state.own_x, state.own_y);
        const scTgt = toScreen(tgt.x, tgt.y);
        const dist = Math.hypot(state.own_x - tgt.x, state.own_y - tgt.y);

        ctx.strokeStyle = dist < 200 ? "rgba(239, 68, 68, 0.75)" : "rgba(245, 158, 11, 0.45)";
        ctx.lineWidth = 1.8;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(scOwn.x, scOwn.y);
        ctx.lineTo(scTgt.x, scTgt.y);
        ctx.stroke();
        ctx.setLineDash([]);
      });
    }

    // Draw our autonomous vessel
    drawShip(state.own_x, state.own_y, state.own_course, state.own_speed, true, "OUR VESSEL (TwinGuard)", "#0284c7");

    // Update HUD metrics
    const deg = Math.round((state.own_course * 180 / Math.PI)) % 360;
    const finalDeg = deg < 0 ? deg + 360 : deg;
    document.getElementById("hudCourse").innerText = String(finalDeg).padStart(3, "0") + "°";
    document.getElementById("hudSpeed").innerText = (state.own_speed * 1.9438).toFixed(1) + " kts";
    document.getElementById("timeText").innerText = "T+" + (state.step || currentFrame) + "s";
    document.getElementById("timeSlider").value = currentFrame;

    // Nearest clearance calculation
    const dists = (state.targets || []).map(t => Math.hypot(state.own_x - t.x, state.own_y - t.y));
    const minD = dists.length > 0 ? Math.min(...dists) : 9999;
    const hudClearance = document.getElementById("hudClearance");
    hudClearance.innerText = minD.toFixed(0) + " m";
    hudClearance.style.color = minD < 100 ? "#ef4444" : (minD < 300 ? "#f59e0b" : "#10b981");

    // TwinGuard gate decision
    const dec = aud.decision || "APPROVE";
    const hudGate = document.getElementById("hudGate");
    hudGate.innerText = typeof dec === "object" ? (dec.value || "APPROVE") : dec;
    hudGate.style.color = dec === "APPROVE" ? "#10b981" : (dec === "MODIFY" ? "#f59e0b" : "#ef4444");

    // Controlled simulation stepping
    const now = performance.now();
    const effectiveInterval = stepIntervalMs / speedMultiplier;
    if (isPlaying && (now - lastFrameStepTime >= effectiveInterval)) {
      lastFrameStepTime = now;
      currentFrame++;
      if (currentFrame >= history.length) {
        if (isLooping) {
          currentFrame = 0;
        } else {
          currentFrame = history.length - 1;
          isPlaying = false;
          document.getElementById("playBtn").innerText = "▶ Replay";
        }
      }
    }

    requestAnimationFrame(render);
  }

  // Event Listeners
  const playBtn = document.getElementById("playBtn");
  playBtn.addEventListener("click", () => {
    if (currentFrame >= history.length - 1) {
      currentFrame = 0;
      isPlaying = true;
      playBtn.innerText = "⏸ Pause";
    } else {
      isPlaying = !isPlaying;
      playBtn.innerText = isPlaying ? "⏸ Pause" : "▶ Play";
    }
  });

  const rewindBtn = document.getElementById("rewindBtn");
  rewindBtn.addEventListener("click", () => {
    currentFrame = 0;
    isPlaying = true;
    playBtn.innerText = "⏸ Pause";
  });

  const loopBtn = document.getElementById("loopBtn");
  loopBtn.addEventListener("click", () => {
    isLooping = !isLooping;
    loopBtn.innerText = isLooping ? "🔁 Loop: ON" : "🔁 Loop: OFF";
    loopBtn.classList.toggle("btn-active", isLooping);
  });
  loopBtn.classList.add("btn-active");

  const slider = document.getElementById("timeSlider");
  slider.addEventListener("input", (e) => {
    currentFrame = parseInt(e.target.value, 10);
    isPlaying = false;
    playBtn.innerText = "▶ Play";
  });

  function setSpeed(spd, btnId) {
    speedMultiplier = spd;
    ["spd1", "spd2"].forEach(id => {
      document.getElementById(id).classList.remove("btn-active");
    });
    document.getElementById(btnId).classList.add("btn-active");
  }

  document.getElementById("spd1").addEventListener("click", () => setSpeed(1, "spd1"));
  document.getElementById("spd2").addEventListener("click", () => setSpeed(2, "spd2"));
  document.getElementById("spd1").classList.add("btn-active");

  // Start animation loop
  requestAnimationFrame(render);
</script>
</body>
</html>
