[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twinguard"
version = "0.1.0"
description = "Digital-Twin-Based Counterfactual Risk Assessment and Safety Gating for Autonomous Maritime Agents"
authors = [
    {name = "TwinGuard Team"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "gymnasium>=0.29.1",
    "torch>=2.2.0",
    "stable-baselines3>=2.3.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
include = ["twinguard*"]
